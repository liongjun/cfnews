name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时自动检查一次

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/byJoey/cfnew/releases/latest)

          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          ASSETS_URL=$(echo "$RELEASE_JSON" | jq -r '.assets_url // empty')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未能获取 tag_name，原始响应片段："
            echo "$RELEASE_JSON" | head -c 500
            exit 1
          fi
          echo "最新版本: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          DOWNLOAD_URL=$(curl -sS -H "Accept: application/vnd.github+json" "$ASSETS_URL" \
            | jq -r '.[] | select(.name | ascii_downcase == "pages.zip") | .browser_download_url' | head -1)
          FILE_NAME="Pages.zip"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到 Pages.zip"
            echo "可用的文件列表："
            curl -sS -H "Accept: application/vnd.github+json" "$ASSETS_URL" | jq -r '.[].name' | sed 's/^/  - /'
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "下载 URL: $DOWNLOAD_URL"

      - name: 检查当前版本
        id: check_version
        run: |
          if [ ! -f "VERSION.txt" ]; then
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(tr -d '\n\r ' < VERSION.txt)
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
            echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          curl -sSL --retry 3 --retry-delay 2 -o "$FILE_NAME" "$DOWNLOAD_URL"
          [ -s "$FILE_NAME" ] || { echo "错误：下载失败"; exit 1; }
          echo "下载成功: $(stat -c%s "$FILE_NAME") 字节"

          unzip -o "$FILE_NAME" -d .
          [ -f "_worker.js" ] || { echo "错误：未找到 _worker.js"; exit 1; }
          echo "解压缩成功"

          rm -f "$FILE_NAME"
          echo "$VERSION" > VERSION.txt
          echo "版本记录已更新: $VERSION"

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          {
            echo "## 同步结果"
            echo "- 最新版本: ${{ steps.get_latest.outputs.version }}"
            echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}"
            if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
              echo "- 状态: ✅ 已更新到新版本"
            else
              echo "- 状态: ⏭️ 版本相同，无需更新"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
